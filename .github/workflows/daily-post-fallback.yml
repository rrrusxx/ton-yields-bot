name: Daily Yields Post (fallback)

# GitHub's own schedule, kept only as a fallback: it starts hours late on
# most days and has skipped whole days, so the post is started at 08:00 UTC
# by an outside scheduler instead (HOSTING.md). When this run comes, the
# post run it starts finds today's marker and stops; if the outside
# scheduler failed, that post run posts, late but the same day.
# If GitHub disables this schedule after 60 days without repository
# activity, only this fallback stops; daily-post.yml keeps working.
on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  start-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Events caused by GITHUB_TOKEN start no new workflow runs, except
      # workflow_dispatch (and repository_dispatch); this uses the first.
      # A scheduled run that GitHub starts after midnight UTC belongs to the
      # previous day: starting the post then would publish the new day's post
      # at night and make that morning's 08:00 run stop.
      - name: Start the daily post workflow
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%-H)" -lt 9 ]; then
            echo "Yesterday's late fallback run; nothing to do"
            exit 0
          fi
          gh workflow run daily-post.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
